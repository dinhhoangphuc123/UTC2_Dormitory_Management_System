name: CI / Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: Dormitory/Directory.Packages.props

      - name: Restore dependencies
        run: dotnet restore Dormitory/Dormitory.slnx

      - name: Build solution
        run: dotnet build Dormitory/Dormitory.slnx --configuration Release --no-restore

      - name: Run Unit Tests
        run: dotnet test Dormitory/Dormitory.UnitTests/Dormitory.UnitTests.csproj --configuration Release --no-build --verbosity normal

      - name: Run Integration Tests
        run: dotnet test Dormitory/Dormitory.IntegrationTests/Dormitory.IntegrationTests.csproj --configuration Release --no-build --verbosity normal

      - name: Install Playwright Chromium (only when E2E_BASE_URL is set)
        if: ${{ vars.E2E_BASE_URL != '' }}
        run: pwsh Dormitory/Dormitory.E2ETests/bin/Release/net10.0/playwright.ps1 install chromium --with-deps

      - name: Run E2E Tests (only when E2E_BASE_URL is set)
        if: ${{ vars.E2E_BASE_URL != '' }}
        env:
          E2E_BASE_URL: ${{ vars.E2E_BASE_URL }}
        run: dotnet test Dormitory/Dormitory.E2ETests/Dormitory.E2ETests.csproj --configuration Release --no-build --verbosity normal
